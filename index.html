<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d96ff">
<title>瑄瑄的學習樂園 📚</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#fff4e6}
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:#2b2d42;min-height:100vh;
 background:radial-gradient(circle at 15% 10%,#ffe5ec 0,transparent 40%),radial-gradient(circle at 90% 20%,#d8f3dc 0,transparent 40%),linear-gradient(180deg,#e0f2fe,#fff4e6 60%);padding:0 0 40px}
header{text-align:center;padding:28px 16px 8px;padding-top:calc(28px + env(safe-area-inset-top))}
header h1{margin:0;font-size:clamp(28px,8vw,46px);letter-spacing:2px}
header p{margin:8px 0 0;font-size:18px;color:#555}
main{max-width:960px;margin:0 auto;padding:12px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:12px}
.card{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;background:#fff;border-radius:24px;padding:18px;min-height:120px;
 box-shadow:0 7px 0 var(--c,#4d96ff);border:4px solid var(--c,#4d96ff);transition:transform .15s}
a.card:hover,a.card:focus{transform:translateY(-3px)}a.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.card .ico{font-size:52px;width:76px;height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:var(--bg,#e6f0ff)}
.card h2{margin:0;font-size:26px}.card h3{margin:0;font-size:22px}
.card p{margin:6px 0 0;font-size:16px;color:#555;line-height:1.5}
.tag{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--bg,#eee);margin-top:6px}
.card.soon{opacity:.55;filter:grayscale(.6);box-shadow:0 7px 0 #bbb;border-color:#ccc;border-style:dashed}
.back{display:inline-block;margin:0 0 4px;text-decoration:none;font-weight:800;font-size:18px;color:#fff;background:#4d96ff;border-radius:999px;padding:10px 18px;box-shadow:0 4px 0 #2b6ad8;min-height:48px}
.unit{font-size:20px;margin:24px 0 4px;padding-left:4px}
footer{text-align:center;color:#888;font-size:14px;margin-top:30px}
</style>
</head>
<body>
<header>
  <h1>📚 瑄瑄的學習樂園</h1>
  <p>四年級上學期・選一個科目開始探險吧！</p>
</header>
<main>
  <!-- 10/31 考卷錯題複習 START -->
  <a href="review-1031/" id="r1031" style="display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,#fff1a8,#ffd6e5);color:#2b2d42;text-decoration:none;box-shadow:0 6px 0 rgba(0,0,0,.1);border:3px solid #ffd166"><span style="font-size:40px;line-height:1">📝</span><span style="flex:1;min-width:0"><b style="display:block;font-size:clamp(19px,5vw,24px)">10/31 考卷錯題複習</b><span style="font-size:15px;color:#555">國語、數學、英文：老師扣分的題目，每題都能單獨重做</span></span><span style="font-size:26px">➜</span></a>
  <!-- 10/31 考卷錯題複習 END -->
  <div class="grid" id="subjects"></div>
  <footer>⭐ 每一課的星星都會自動記在這台裝置上</footer>
</main>
<script>
/* 新增科目：在這個陣列加一筆就好（href 留空 = 即將推出） */
var SUBJECTS = [
  { name: "自然", icon: "🔬", color: "#4d96ff", bg: "#e6f0ff", href: "nature/", desc: "轉轉月相轉盤、觀察月相的祕密，再到水邊認識水生植物和動物，還能打造自己的池塘、玩翻牌配對！", count: 6 },
  { name: "社會", icon: "🗺️", color: "#2a9d8f", bg: "#d8f3dc", href: "social/", desc: "地圖、五大地形、氣候，還有家鄉的人口組成和人口變化！", count: 6 },
  { name: "數學", icon: "🔢", color: "#ff9f1c", bg: "#fff1d6", href: "math/", desc: "認識一億以內的大數，乘法直式和補 0 快算，用量角器量角、畫角和旋轉角，直式除法一步一步拆解和驗算，公里、公尺換算和路線加減，還有三角形分類、畫三角形和全等，加上數列找規律、應用題和考卷題型練習！", count: 6 },
  { name: "國語", icon: "📖", color: "#ff6b9a", bg: "#ffe6ef", href: "chinese/", desc: "南一版：窗口邊的臺灣欒樹、奶奶的排骨粥、充滿希望的五味屋、玉山之歌、高舉臺灣之光、臺灣的驕傲，練習生字、語詞、句型和修辭，還有第一～六課改錯字練習！", count: 7 },
  { name: "英語", icon: "🔤", color: "#9b5de5", bg: "#f3e8ff", href: "english/", desc: "康軒 Wonder World 3：Unit 1 The Big Wind（天氣）、Unit 2 Going Back Home（時間），單字、句型、看時鐘、Magic e 發音、聽力和拼字遊戲，還有 Review 1 期中複習！", count: 3 }
];
document.getElementById("subjects").innerHTML = SUBJECTS.map(function (s) {
  var inner = '<div class="ico">' + s.icon + '</div><div><h2>' + s.name + '</h2><p>' + s.desc + '</p>' +
    '<span class="tag">' + (s.href ? (s.count || 0) + " 個單元活動 ➜" : "🚧 即將推出") + '</span></div>';
  var st = 'style="--c:' + s.color + ';--bg:' + s.bg + '"';
  return s.href ? '<a class="card" ' + st + ' href="' + s.href + '">' + inner + '</a>'
                : '<div class="card soon" ' + st + ' aria-disabled="true">' + inner + '</div>';
}).join("");
</script>
</body>
</html>
