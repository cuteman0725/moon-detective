<style>

<script id="core">
/* ===== core: builds the step-by-step 直式 for division and multiplication (pure, testable) ===== */
var Core=(function(){
"use strict";
var PLACE=["個","十","百","千","萬","十萬","百萬"];
function placeName(i,n){return PLACE[n-1-i]+"位";}
function roundDiv(d){var L=String(d).length;if(L<2)return d;var p=Math.pow(10,L-1);return Math.round(d/p)*p;}
function cellsOf(r,text,end){var a=[];for(var k=0;k<text.length;k++)a.push({r:r,c:end-text.length+1+k,ch:text[k]});return a;}
function estimate(cur,d){
  var q=Math.floor(cur/d),r=roundDiv(d),out=[],e;
  if(r===d){e=q;out.push("<b>"+cur+"</b> 裡面有幾個 "+d+"？想一想 "+d+" 的乘法，試試 <b>"+e+"</b>。");}
  else{var x=Math.floor(cur/r);e=Math.max(1,Math.min(9,x));
    out.push("① 估商：把 "+d+" 想成 <b>"+r+"</b>，"+cur+" 裡面大約有 "+x+" 個 "+r+(x>9?"（但商最多是 9）":x<1?"（不到 1 個，可是 "+cur+" 比 "+d+" 大，至少有 1 個）":"")+"，先試 <b>"+e+"</b>。");}
  var guard=0;
  while(e!==q&&guard++<20){var p=e*d;
    if(p>cur){out.push("試商："+d+" × "+e+" ＝ "+p+"，比 "+cur+" <b>大</b>，太大了！商改小一點，試 <b>"+(e-1)+"</b>。");e--;}
    else{out.push("試商："+d+" × "+e+" ＝ "+p+"，"+cur+" − "+p+" ＝ "+(cur-p)+"，還比 "+d+" 大（還能再分），商改大一點，試 <b>"+(e+1)+"</b>。");e++;}}
  out.push("確認："+d+" × "+q+" ＝ "+(q*d)+"，沒有超過 "+cur+"；而且 "+cur+" − "+(q*d)+" ＝ "+(cur-q*d)+"，比 "+d+" 小 ✓ 所以商是 <b>"+q+"</b>。");
  return out;
}
function buildDiv(N,d){
  var S=String(N),n=S.length,ds=String(d),dl=ds.length,C0=dl+1,i,k;
  var sh={type:"div",N:N,d:d,n:n,C0:C0,ncols:C0+n,static:[],fields:[],demo:[],valid:true,carryRow:false};
  for(i=0;i<dl;i++)sh.static.push({r:1,c:i,ch:ds[i],cls:"dvs"});
  sh.static.push({r:1,c:dl,ch:"",cls:"brk"});
  for(i=0;i<n;i++)sh.static.push({r:1,c:C0+i,ch:S[i],cls:"dvd"});
  var F=sh.fields,D=sh.demo;
  var L=1;while(L<n&&+S.slice(0,L)<d)L++;
  sh.L=L;
  D.push({fi:0,t:0,hl:[],text:"題目：<b>"+N+" ÷ "+d+"</b>。除數 "+d+" 寫在左邊，被除數 "+N+" 寫在「厂」的下面。商要寫在「厂」的上面。"});
  for(var len=1;len<=L;len++){var pv=+S.slice(0,len),hl=[];for(i=0;i<len;i++)hl.push([1,C0+i]);
    D.push({fi:0,t:0,hl:hl,hl2:pv>=d?[[0,C0+len-1]]:[],text:pv<d?"先看被除數最前面 "+len+" 位：<b>"+pv+"</b>，比 "+d+" 小，<b>不夠除</b>，再多看一位。"
      :"看前 "+len+" 位：<b>"+pv+"</b>，比 "+d+" 大，<b>夠除了！</b>所以商從<b>"+placeName(len-1,n)+"</b>開始寫（粉紅色那格），商會是 <b>"+(n-L+1)+" 位數</b>。"});}
  F.push({kind:"pos",cells:[],col:C0+L-1,prefix:+S.slice(0,L),L:L});
  var cur=+S.slice(0,L),col=L-1,row=2,first=true,lineRow=-1,lineText="",rem=0;
  var curCells=[];for(i=0;i<L;i++)curCells.push([1,C0+i]);
  while(true){
    var q=Math.floor(cur/d);
    if(q>0||first){
      estimate(cur,d).forEach(function(t){D.push({fi:F.length,t:0,hl:curCells,hl2:[[0,C0+col]],text:t});});
      F.push({kind:"q",cells:[{r:0,c:C0+col,ch:String(q)}],cur:cur,d:d,q:q,hl:curCells,place:placeName(col,n)});
      D.push({fi:F.length,t:0,hl:curCells,hl2:[[0,C0+col]],text:"把商 <b>"+q+"</b> 寫在"+placeName(col,n)+"的上面（對齊 "+cur+" 的最後一位）。"});
      var prod=q*d,ps=String(prod),pr=row++,pc=cellsOf(pr,ps,C0+col);
      var c1=Math.min(curCells[0][1],pc[0].c);
      F.push({kind:"prod",cells:pc,cur:cur,d:d,q:q,prod:prod,hl:curCells,ul:{r:pr,c1:c1,c2:C0+col}});
      D.push({fi:F.length,t:0,hl:curCells,text:"② 乘："+q+" × "+d+" ＝ <b>"+prod+"</b>，寫在 "+cur+" 的下面，最後一位對齊，再畫一條線。"});
      rem=cur-prod;var rr=row++,fin=(col===n-1),rt=rem>0?String(rem):(fin?"0":"");
      if(rt)F.push({kind:"rem",cells:cellsOf(rr,rt,C0+col),cur:cur,prod:prod,rem:rem,d:d,hl:curCells});
      D.push({fi:F.length,t:0,hl:rt?cellsOf(rr,rt,C0+col).map(function(x){return[x.r,x.c];}):[],text:"③ 減："+cur+" − "+prod+" ＝ <b>"+rem+"</b>。④ 比一比："+rem+" 比 "+d+" 小 ✓"+(rem===0&&!fin?"　剛好減完，<b>0 不用寫</b>。":"")});
      lineRow=rr;lineText=rt;first=false;
    }else{
      F.push({kind:"q0",cells:[{r:0,c:C0+col,ch:"0"}],cur:cur,d:d,q:0,hl:curCells,place:placeName(col,n)});
      D.push({fi:F.length,t:0,hl:curCells,hl2:[[0,C0+col]],text:"<b>"+cur+"</b> 比 "+d+" 小，<b>不夠除</b>，所以"+placeName(col,n)+"的商寫 <b>0</b>（不能空著，不然位數會錯！）"});
      rem=cur;
    }
    if(col===n-1)break;

  if(f.kind==="pos"){this.fb("info","先<b>點一下</b>「厂」上面的格子，選商要從哪一位開始寫。");return;}
  var ex=this.expected(),sh=this.sh;
  if(String(dg)===ex.ch){beep(true);this.t++;
    if(this.t>=f.cells.length){var msg={q:"✓ 商是 "+f.q+"！",q0:"✓ 不夠除，商寫 0！",prod:"✓ 乘對了！",rem:"✓ 減對了！",down:"✓ 移下來了！",pp:"✓ 這一行乘完了！",sum:"✓ 加對了！",final:"✓ 算完了！"}[f.kind]||"✓";
      this.fb("good",msg);}
    else $(this.o.fb).className="fb";
    this.advance();return;}
  var cell=[ex.r,ex.c],m;
  switch(f.kind){
    case"q":var x=+dg,p=x*f.d;
      m=x>f.q?f.d+" × "+x+" ＝ "+p+"，比 "+f.cur+" <b>大</b>，太大了，改小一點！":f.d+" × "+x+" ＝ "+p+"，"+f.cur+" − "+p+" ＝ "+(f.cur-p)+"，<b>還比 "+f.d+" 大</b>，商可以再大一點！";break;
    case"q0":m=f.cur+" 比 "+f.d+" 小，一個都分不到喔！";break;
    case"prod":m="再算一次 "+f.q+" × "+f.d+"。";break;
    case"rem":m="再減一次看看，記得借位！";break;
    case"down":m="要移下來的是被除數下一位的數字（綠色那格）。";break;
    default:m="這一格再想一想！";}
  this.bad(cell,m);};

/* ---------- 試商小幫手 ---------- */
function helperHTML(f,d){var cur=f&&(f.kind==="q"||f.kind==="q0"||f.kind==="prod")?f.cur:null,h="<b>🧮 試商小幫手："+d+" 的倍數</b>"+(cur!==null?"（和 "+cur+" 比一比）":"")+"<table>";
  var best=cur!==null?Math.floor(cur/d):-1;
  for(var i=1;i<=9;i++){var v=d*i,cls=cur===null?"":(i===best?"best":v<=cur?"ok":"over");h+='<tr class="'+cls+'"><td>'+d+" × "+i+"</td><td>＝ <b>"+v+"</b></td><td>"+(cur===null?"":i===best?"👈 最接近":v<=cur?"≤ "+cur:"太大")+"</td></tr>";}
  return h+"</table>";}

/* ---------- 練習 ---------- */
function pad(id,onDigit,extra){var h="";[1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button data-d="'+n+'">'+n+"</button>";});
  h+='<button class="fn" data-x="hint">💡 提示</button><button data-d="0">0</button>'+(extra?'<button class="fn" data-x="help">🧮 小幫手</button>':'<button class="fn" data-x="none" style="visibility:hidden"></button>');
  $(id).innerHTML=h;$(id).addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;if(b.dataset.d!==undefined)onDigit(b.dataset.d,null);else onDigit(null,b.dataset.x);});}
var pLevel=1,pProb=null,pPhase="div",pMiss=0;
var runner=new Runner({sheet:"pSheet",prompt:"pPrompt",fb:"pFb",title:"pTitle",done:"pDone",
  onDraw:function(r){if($("pHelper").classList.contains("show"))$("pHelper").innerHTML=helperHTML(r.field(),pProb.d);},
  onDone:function(r){var dn=$("pDone");
    if(pPhase==="div"){pMiss+=r.miss;var sh=r.sh;dn.className="done show";
      dn.innerHTML="🎉 <b>"+sh.N+" ÷ "+sh.d+" ＝ "+sh.Q+" … "+sh.R+"</b>"+(sh.R===0?"（整除）":"")+"<br>商是 "+String(sh.Q).length+" 位數。接下來<b>驗算</b>，確定答案是對的！<div class='btns'><button class='btn teal' id='pGoCheck'>✓ 開始驗算</button></div>";
      $("pGoCheck").onclick=function(){pPhase="check";$("pHelper").className="helper";runner.load(Core.checkSheet(pProb.N,pProb.d),"驗算："+pProb.d+" × "+sh.Q+(sh.R?" ＋ "+sh.R:"")+" ＝ "+pProb.N+" ？",pProb.N+"÷"+pProb.d+"（驗算）");window.scrollTo(0,$("pTitle").getBoundingClientRect().top+scrollY-70);};}
    else{pMiss+=r.miss;var perfect=pMiss===0,gain=perfect?2:1;
      store.done["L"+pLevel]=(store.done["L"+pLevel]||0)+1;store.streak=perfect?store.streak+1:0;store.best=Math.max(store.best,store.streak);save();addStars(gain,dn);
      dn.className="done show";dn.innerHTML="✅ 驗算正確："+r.sh.a+" × "+r.sh.b+(r.sh.addend?" ＋ "+r.sh.addend:"")+" ＝ <b>"+r.sh.Fin+"</b> ＝ 被除數！<br>"+(perfect?"💯 全部一次就對，+2 ⭐！連續全對 "+store.streak+" 題 🔥":"完成 +1 ⭐！錯的地方記下來了，多練幾次就會更熟 💪")+"<div class='btns'><button class='btn org' id='pNext'>下一題 ➡</button></div>";
      $("pNext").onclick=function(){newPractice();};}}});
pad("pPad",function(d,x){if(d!==null)runner.press(d);else if(x==="hint"){if(runner.field())runner.fb("info","💡 "+runner.hintFor());}else if(x==="help"){var hp=$("pHelper");hp.classList.toggle("show");hp.innerHTML=helperHTML(runner.field(),pProb.d);}},true);
function newPractice(){var lv=pLevel===0?1+Math.floor(Math.random()*4):pLevel;pProb=Core.genDiv(lv);pPhase="div";pMiss=0;
  runner.load(Core.buildDiv(pProb.N,pProb.d),pProb.N+" ÷ "+pProb.d+" ＝ ？",pProb.N+"÷"+pProb.d);
  if($("pHelper").classList.contains("show"))$("pHelper").innerHTML=helperHTML(runner.field(),pProb.d);}

var resetArm=false;
function renderRec(){
  var tot=0;for(var k in store.done)if(k[0]==="L")tot+=store.done[k];
  $("stats").innerHTML=[["⭐ 星星",store.stars],["➗ 完成除法",tot],["🔥 連續全對",store.streak],["🏅 最佳連續",store.best],["✖️ 完成乘法",["M1","M2","M3","M4"].reduce(function(a,k){return a+(store.done[k]||0);},0)]].map(function(s){return '<div class="stat">'+s[0]+"<b>"+s[1]+"</b></div>";}).join("");
  $("badges").innerHTML=BADGES.map(function(b){var g=store.stars>=b.n;return '<span class="bdg'+(g?" got":"")+'">'+b.t+(g?"":"（"+b.n+"⭐）")+"</span>";}).join("");
  var ks=Object.keys(store.mist).sort(function(a,b){return store.mist[b]-store.mist[a];});
  $("mistakes").innerHTML=ks.length?'<table class="rec"><tr><th>哪一步</th><th>次數</th><th>小撇步</th></tr>'+ks.map(function(k){return "<tr><td><b>"+(MT[k]||k)+"</b></td><td>"+store.mist[k]+"</td><td>"+(TIPS[k]||"")+"</td></tr>";}).join("")+"</table>":'<div class="small">還沒有錯誤紀錄，太棒了！去「練習」挑戰看看吧 💪</div>';
  $("recent").innerHTML=store.recent.length?'<table class="rec">'+store.recent.map(function(r){return "<tr><td>"+r.p+"</td><td>"+(MT[r.k]||r.k)+"</td></tr>";}).join("")+"</table>":'<div class="small">沒有 🎉</div>';
}
$("resetBtn").addEventListener("click",function(){if(!resetArm){resetArm=true;$("resetBtn").textContent="再按一次確認清除";setTimeout(function(){resetArm=false;$("resetBtn").textContent="清除紀錄";},3000);return;}
  store={stars:0,streak:0,best:0,done:{},mist:{},recent:[]};save();renderScore();renderRec();resetArm=false;$("resetBtn").textContent="清除紀錄";});
renderScore();
