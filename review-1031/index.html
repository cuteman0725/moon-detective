<script id="core-div">
/* ===== 以下複製自 math/division/index.html（2d77844）的 Core，只把名稱 Core 改成 DivCore ===== */
/* ===== core: builds the step-by-step 直式 for division and multiplication (pure, testable) ===== */
var DivCore=(function(){
"use strict";
var PLACE=["個","十","百","千","萬","十萬","百萬"];
function placeName(i,n){return PLACE[n-1-i]+"位";}
function roundDiv(d){var L=String(d).length;if(L<2)return d;var p=Math.pow(10,L-1);return Math.round(d/p)*p;}
function cellsOf(r,text,end){var a=[];for(var k=0;k<text.length;k++)a.push({r:r,c:end-text.length+1+k,ch:text[k]});return a;}
function estimate(cur,d){
  var q=Math.floor(cur/d),r=roundDiv(d),out=[],e;
  if(r===d){e=q;out.push("<b>"+cur+"</b> 裡面有幾個 "+d+"？想一想 "+d+" 的乘法，試試 <b>"+e+"</b>。");}
  else{var x=Math.floor(cur/r);e=Math.max(1,Math.min(9,x));
    out.push("① 估商：把 "+d+" 想成 <b>"+r+"</b>，"+cur+" 裡面大約有 "+x+" 個 "+r+(x>9?"（但商最多是 9）":x<1?"（不到 1 個，可是 "+cur+" 比 "+d+" 大，至少有 1 個）":"")+"，先試 <b>"+e+"</b>。");}
  var guard=0;
  while(e!==q&&guard++<20){var p=e*d;
    if(p>cur){out.push("試商："+d+" × "+e+" ＝ "+p+"，比 "+cur+" <b>大</b>，太大了！商改小一點，試 <b>"+(e-1)+"</b>。");e--;}
    else{out.push("試商："+d+" × "+e+" ＝ "+p+"，"+cur+" − "+p+" ＝ "+(cur-p)+"，還比 "+d+" 大（還能再分），商改大一點，試 <b>"+(e+1)+"</b>。");e++;}}
  out.push("確認："+d+" × "+q+" ＝ "+(q*d)+"，沒有超過 "+cur+"；而且 "+cur+" − "+(q*d)+" ＝ "+(cur-q*d)+"，比 "+d+" 小 ✓ 所以商是 <b>"+q+"</b>。");
  return out;
}
function buildDiv(N,d){
  var S=String(N),n=S.length,ds=String(d),dl=ds.length,C0=dl+1,i,k;
  var sh={type:"div",N:N,d:d,n:n,C0:C0,ncols:C0+n,static:[],fields:[],demo:[],valid:true,carryRow:false};
  for(i=0;i<dl;i++)sh.static.push({r:1,c:i,ch:ds[i],cls:"dvs"});
  sh.static.push({r:1,c:dl,ch:"",cls:"brk"});
  for(i=0;i<n;i++)sh.static.push({r:1,c:C0+i,ch:S[i],cls:"dvd"});
  var F=sh.fields,D=sh.demo;
  var L=1;while(L<n&&+S.slice(0,L)<d)L++;
  sh.L=L;
  D.push({fi:0,t:0,hl:[],text:"題目：<b>"+N+" ÷ "+d+"</b>。除數 "+d+" 寫在左邊，被除數 "+N+" 寫在「厂」的下面。商要寫在「厂」的上面。"});
  for(var len=1;len<=L;len++){var pv=+S.slice(0,len),hl=[];for(i=0;i<len;i++)hl.push([1,C0+i]);

    if(!og)msg.push(g===4?"大格數：4 大格是往<b>反方向</b>（3→2→1→12→11）數的！題目是順時針：3→4→5…→11。":"大格數：從 3 開始，照時鐘走的方向一格一格數到 11，再數一次。");
    else msg.push("大格數 8 ✅ 對了！");
    if(!od)msg.push(d===120?"度數：120° 是反方向轉 4 大格的度數喔！":(og||d!==g*30?"度數：1 大格是 30°，"+(og?"8 大格 ＝ 8 × 30° ＝ ？":"大格數算對後再乘 30°。"):"度數：你是用你的大格數 × 30 算的，算法對！先把大格數改正。"));
    else msg.push("度數 240° ✅ 對了！");
    fb("bad",msg.join("<br>"));}
  $("bCheck").onclick=check;enterKey(check);
  $("bHint").onclick=function(){hint("時鐘上相鄰兩個數字之間是 <b>1 大格 ＝ 30°</b>。從 3 開始順著 4、5、6…數到 11，數數看共幾格。");};
  $("bShow").onclick=function(){shown("3→4→5→6→7→8→9→10→11，共 8 大格；8 × 30° ＝ 240°。");};};
/* ---- 旋轉方向 ---- */
BUILD["m-dir"]=function(){var DIRS=["順時針","逆時針"];
  $("pBody").innerHTML='<div class="qtxt">看紅色箭頭，橘色指針各是往哪個方向旋轉？</div><div class="two"><div><b>圖 A</b><svg class="lsvg clock" viewBox="0 0 400 400" aria-label="圖A">'+clockSVG({start:12,cum:150})+"</svg>"+choice("chA",DIRS)+'</div><div><b>圖 B</b><svg class="lsvg clock" viewBox="0 0 400 400" aria-label="圖B">'+clockSVG({start:2,cum:-90})+"</svg>"+choice("chB",DIRS)+"</div></div>"+ctlBtns();
  bindChoice("chA");bindChoice("chB");
  $("bCheck").onclick=function(){var a=sel("chA"),b=sel("chB");if(!a||!b){fb("info","圖 A 和圖 B 都要選喔！");return;}
    var oa=a==="順時針",ob=b==="逆時針";markChoice("chA",oa);markChoice("chB",ob);rec(oa&&ob,{a:oa,b:ob},"A:"+a+"、B:"+b);
    if(oa&&ob){fbHide();finish("答對了！圖 A 和時鐘指針走的方向一樣（<b>順時針</b>），圖 B 相反（<b>逆時針</b>）。");return;}
    fb("bad",(oa?"圖 A ✅":"圖 A 再看一次：箭頭是 12→1→2→… 這樣走嗎？")+"<br>"+(ob?"圖 B ✅":"圖 B 再看一次：箭頭是往數字變小的方向走嗎？"));};
  $("bHint").onclick=function(){hint("時鐘的指針平常是 12→1→2→3 這樣走，和它<b>一樣</b>方向叫順時針，<b>相反</b>叫逆時針。看紅色箭頭從始邊往哪邊轉。");};
  $("bShow").onclick=function(){shown("圖 A：順時針（12 轉到 5）；圖 B：逆時針（2 轉到 11）。");};};
/* ---- 量角器 ---- */
function buildMeasure(it){var M=C.makeAngle(C.VX,C.VY,it.a,it.D,C.LONG,C.LONG),hi=false,doneF=false,K=C.kind(it.D);
  var sr=C.snapRots(M)[0];
  $("pBody").innerHTML='<div class="work"><div class="left"><div class="svgwrap"><svg id="mSvg" class="lsvg drag" viewBox="0 0 400 400" aria-label="量角"><g id="mScene"></g></svg></div>'+
   '<div class="btns center"><button class="btn teal" id="mS1">① 中心點對準頂點</button><button class="btn teal" id="mS2">② 0 度線對準一條邊</button></div>'+
   '<div class="btns rotbtns center" id="mRot"><button class="btn white small" data-r="15">↺ 15°</button><button class="btn white small" data-r="1">↺ 1°</button><button class="btn white small" data-r="-1">↻ 1°</button><button class="btn white small" data-r="-15">↻ 15°</button></div>'+
   '<p class="small center" style="text-align:center">拖拉量角器可以移動；拖橘色圓鈕可以旋轉。</p></div>'+
   '<div class="right"><div class="note">依訂正後的度數重新畫的練習圖，不是考卷上的道路圖原圖</div><div class="checks" id="mChecks"></div>'+
   '<div class="qtxt">紅色弧線的角是幾度？是什麼角？</div><div class="row">'+numIn("inD")+' 度 <span class="mark" id="mkD"></span></div>'+
   '<div class="row">'+choice("chK",["銳角","直角","鈍角"])+'<span class="mark" id="mkK"></span></div><p class="small">度數和角的種類會<b>分開</b>對答案。</p>'+ctlBtns()+"</div></div>";
  var L={svg:$("mSvg"),pose:{cx:Math.min(330,Math.max(70,M.vx+70)),cy:Math.min(370,M.vy+120),rot:C.norm(sr+35)},render:function(){draw();},snap:function(p,tc,tr){return C.snap(M,p.cx,p.cy,p.rot,tc,tr);}};
  function draw(){var s="",inf=C.poseInfo(M,L.pose.cx,L.pose.cy,L.pose.rot);s+=protG(L.pose.cx,L.pose.cy,L.pose.rot,true);
    s+=rayM(M.vx,M.vy,M.a,M.l1,"ray")+rayM(M.vx,M.vy,M.b,M.l2,"ray");s+='<path class="arc" d="'+C.arcPath(M.vx,M.vy,24,M.a,M.b)+'"/>';
    var lp=P(M.vx,M.vy,M.a+M.D/2,46);s+=txt(lp.x,lp.y,doneF?M.D+"°":"?","lbl")+'<circle class="vtx" cx="'+M.vx+'" cy="'+M.vy+'" r="4"/>';
    $("mScene").innerHTML=s;var sv=$("mSvg");sv.classList.toggle("hiO",hi&&inf.ring==="outer");sv.classList.toggle("hiI",hi&&inf.ring==="inner");
    $("mChecks").innerHTML='<div class="'+(inf.centered?"ok":"")+'">'+(inf.centered?"✅":"⬜")+' ① 中心點對準頂點</div><div class="'+(inf.aligned?"ok":"")+'">'+(inf.aligned?"✅":"⬜")+' ② 0 度線對準一條邊</div><div class="'+(doneF?"ok":"")+'">'+(doneF?"✅":"⬜")+" ③ 從 0 開始的那一圈讀度數</div>";}
  protCtl(L);rotBtns("#pBody",L);bindChoice("chK");
  function aligned(cb){var t=C.snapRots(M),best=C.dd(L.pose.rot,t[0])<=C.dd(L.pose.rot,t[1])?t[0]:t[1];tween(L,{cx:M.vx,cy:M.vy,rot:best},600,cb);}
  $("mS1").onclick=function(){tween(L,{cx:M.vx,cy:M.vy,rot:L.pose.rot},500);};$("mS2").onclick=function(){aligned();};
  function check(){var v=val("inD"),k=sel("chK");if(v===null||!k){fb("info","度數要填、角的種類也要選喔！");return;}
    var od=v===it.D,ok=k===K,m=[];mark("inD",od);markChoice("chK",ok);$("mkD").textContent=od?"✅":"❌";$("mkK").textContent=ok?"✅":"❌";
    rec(od&&ok,{deg:od,kind:ok},v+"°、"+k);
    if(od&&ok){doneF=true;draw();fbHide();finish("答對了！這個角是 <b>"+it.D+"°</b>，是<b>"+K+"</b>。");return;}
    m.push(od?"度數 ✅":(v===180-it.D?"度數：你讀到<b>另一圈</b>的數字了！看 0 度線上的那條邊是從哪一邊的 0 開始（按 💡 提示會標出來）。":(Math.abs(v-it.D)<=3?"度數：很接近了，再看清楚一小格一小格。":"度數：先照 ① ② 把量角器對好，再從 0 開始數。")));
    m.push(ok?"角的種類 ✅":"角的種類：比 90° 小是銳角、剛好 90° 是直角、比 90° 大又比 180° 小是鈍角。"+(od?"":"（先把度數量對再判斷）"));
    fb("bad",m.join("<br>"));}
  $("bCheck").onclick=check;enterKey(check);
  $("bHint").onclick=function(){var inf=C.poseInfo(M,L.pose.cx,L.pose.cy,L.pose.rot);if(!inf.centered||!inf.aligned){hint("先按 ① 和 ②（或自己拖拉）把量角器對好：中心點對頂點、0 度線對一條邊。對好了再按一次提示，我會標出要讀哪一圈。");return;}
    hi=true;draw();var lab=inf.ring==="outer"?"外圈（藍色數字）":"內圈（紅色數字）";hint("0 度線上的那條邊碰到的是<b>"+lab+"的 0</b>，所以讀"+lab+"。那一圈變成金色了，看另一條邊指到幾度！");};
  $("bShow").onclick=function(){aligned(function(){hi=true;draw();});shown(it.D+"°，"+K+"。");};
  draw();}
BUILD["m-a60"]=buildMeasure;BUILD["m-a120"]=buildMeasure;BUILD["m-a100"]=buildMeasure;
/* ---- 132 − 68 ---- */
BUILD["m-sub132"]=function(){var vx=170,vy=320,s="",EQ=["132° ＋ 68°","132° － 68°","180° － 132°"];
  s+=rayM(vx,vy,0,205,"ray")+rayM(vx,vy,68,205,"ray")+rayM(vx,vy,132,205,"ray");
  s+='<path d="'+C.arcPath(vx,vy,118,0,132)+'" fill="none" stroke="#4d96ff" stroke-width="3" stroke-dasharray="7 5"/>';var q=P(vx,vy,18,140);s+=txt(q.x,q.y,"132°","lbl",' style="fill:#1a5fd0"');
  s+=arcLbl(vx,vy,0,68,40,"68°")+arcLbl(vx,vy,68,132,40,"?")+'<circle class="vtx" cx="'+vx+'" cy="'+vy+'" r="5"/>';
  $("pBody").innerHTML=svgBox(s,"","角的分解")+'<div class="qtxt">整個角（藍色虛線）是 132°，其中一部分是 68°。「?」是幾度？</div><div class="row">① 算式：</div>'+choice("chE",EQ)+'<span class="mark" id="mkE"></span><div class="row">② 答：? ＝ '+numIn("inA")+' 度 <span class="mark" id="mkA"></span></div><p class="small">算式和答案會<b>分開</b>對答案。</p>'+ctlBtns();
  bindChoice("chE");
  function check(){var e=sel("chE"),v=val("inA");if(!e||v===null){fb("info","算式要選、答案也要填喔！");return;}
    var oe=e===EQ[1],oa=v===64,m=[];markChoice("chE",oe);mark("inA",oa);$("mkE").textContent=oe?"✅":"❌";$("mkA").textContent=oa?"✅":"❌";
    rec(oe&&oa,{eq:oe,ans:oa},e+" ＝ "+v+"°");
    if(oe&&oa){fbHide();finish("答對了！132° － 68° ＝ <b>64°</b>。");return;}
    m.push(oe?"算式 ✅":"算式：「?」是從整個角裡<b>拿掉</b> 68° 剩下的部分，要用減法。");
    m.push(oa?"答案 ✅":(v===200?"答案：加起來會比整個角還大喔！":"答案：再算一次 132 － 68（個位 2 不夠減 8，要借位）。"));fb("bad",m.join("<br>"));}
  $("bCheck").onclick=check;enterKey(check);
  $("bHint").onclick=function(){hint("整個角 ＝ 68° ＋ ?，所以 ? ＝ 整個角 － 68°。");};
  $("bShow").onclick=function(){shown("132° － 68° ＝ 64°");};};
/* ---- 找錯的步驟 ---- */
BUILD["m-step"]=function(){var vx=200,vy=260,s="",stage=1,eStep=0,eFix=0,eAns=0;
  s+=ln(18,vy,382,vy,"ray")+rayM(vx,vy,93,175,"ray")+rayM(vx,vy,135,175,"ray");
  s+=arcLbl(vx,vy,0,93,38,"93°")+arcLbl(vx,vy,135,180,38,"45°")+arcLbl(vx,vy,93,135,70,"A")+'<circle class="vtx" cx="'+vx+'" cy="'+vy+'" r="5"/>';
  $("pBody").innerHTML=svgBox(s,"","求角A")+'<div class="qtxt">下面是求 ∠A 的算法。<b>最後答案是對的</b>，但其中有<b>一步寫錯了</b>。點一下寫錯的那一步。</div>'+
   '<div class="steps" id="stp"><button data-s="1">① 45° ＋ 93° ＝ 138°</button><button data-s="2">② 180° － 138° ＝ 142°</button><button data-s="3">③ 答：∠A ＝ 42°</button></div><div id="fixArea"></div>'+
   '<div class="btns" style="margin-top:10px"><button class="btn white" id="bHint">💡 提示</button><button class="btn white" id="bShow">👀 看答案</button></div>';
  var bs=$("stp").querySelectorAll("button");
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){if(stage!==1)return;var k=+this.getAttribute("data-s");
    if(k===2){this.classList.add("ok");stage=2;beep(true);fb("good","👍 對！就是第 ② 步。");
      $("fixArea").innerHTML='<div class="row">把第 ② 步改正：180° － 138° ＝ '+numIn("inF")+'° <span class="mark" id="mkF"></span></div><div class="btns"><button class="btn org" id="bFix">✓ 改好了</button></div>';
      $("bFix").onclick=fix;enterKey(fix);try{$("inF").focus();}catch(e){}return;}
    this.classList.add("no");eStep++;beep(false);rec(false,{step:false},"選了第 "+["①","②","③"][k-1]+" 步");
    fb("bad",k===1?"45 ＋ 93：個位 5＋3＝8，十位 4＋9＝13，是 138 ✅，這一步沒錯喔！":"答案 42° 是對的！可是<b>算式裡</b>有一步寫錯了——考試時過程也要對。再看看 ① 和 ②。");};
  function fix(){var v=val("inF");if(v===null)return;var ok=v===42;mark("inF",ok);$("mkF").textContent=ok?"✅":"❌";
    if(!ok){eFix++;beep(false);rec(false,{step:eStep===0,fix:false},"180－138＝"+v);fb("bad",v===142?"142 就是原本寫錯的數字！180 － 138：百位 1 減掉 1 就沒有了，不會還是 1 開頭。":"再算一次 180 － 138（個位 0 不夠減 8，要借位）。");return;}
    stage=3;$("bFix").disabled=true;beep(true);fb("good","👍 改對了！180° － 138° ＝ 42°。");
    $("fixArea").innerHTML+='<div class="row">③ 所以 ∠A ＝ '+numIn("inA")+'° <span class="mark" id="mkA"></span></div><div class="btns"><button class="btn org" id="bAns">✓ 對對看</button></div>';
    $("inF").value="42";$("inF").disabled=true;mark("inF",true);$("bFix").disabled=true;$("bAns").onclick=ans;$("inA").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();ans();}};try{$("inA").focus();}catch(e){}}
  function ans(){var v=val("inA");if(v===null)return;var ok=v===42;mark("inA",ok);$("mkA").textContent=ok?"✅":"❌";
    if(!ok){eAns++;beep(false);rec(false,{step:eStep===0,fix:eFix===0,ans:false},"∠A＝"+v);fb("bad","剛剛改正的第 ② 步就是 ∠A 喔！");return;}
    rec(true,{step:eStep===0,fix:eFix===0,ans:eAns===0},"選②、改成42、∠A＝42");fbHide();
    finish("全部訂正好了！<br>① 45° ＋ 93° ＝ 138°<br>② 180° － 138° ＝ <b>42°</b>（不是 142°）<br>③ ∠A ＝ <b>42°</b>");}
  $("bHint").onclick=function(){hint("一個一個驗算：45 ＋ 93 是多少？180 － 138 的答案會比 180 大還是小？減完的數字應該比 180 <b>小很多</b>。");};
  $("bShow").onclick=function(){shown("第 ② 步錯了：180° － 138° 應該是 42°（不是 142°）；∠A ＝ 42°。");};};
/* ---- 95 ÷ 38 直式＋驗算 ---- */
BUILD["m-div95"]=function(){var N=95,d=38,phase="div",missD=0,missC=0,badD=false,badC=false;
  $("pBody").innerHTML='<div class="title" id="dvTitle"></div><div class="sheetwrap"><div class="sheet" id="dvSheet"></div></div><div class="bubble" id="dvPrompt" style="margin-top:8px"></div><div class="fb" id="dvFb"></div><div class="done" id="dvDone"></div>'+
   '<div class="pad" id="dvPad" style="margin-left:auto;margin-right:auto"></div><div class="helper" id="dvHelper"></div><div class="btns" style="margin-top:10px"><button class="btn white" id="bShow">👀 看答案</button></div>'+
   '<p class="small">要把直式算完，<b>還要把驗算整個寫完</b>（38 × 2 ＋ 19 ＝ 95，十位和個位都要寫）才算完成。</p>';
  var run=new Runner({sheet:"dvSheet",prompt:"dvPrompt",fb:"dvFb",title:"dvTitle",done:"dvDone",
    onDraw:function(r){if($("dvHelper").classList.contains("show"))$("dvHelper").innerHTML=helperHTML(r.field(),d);},
    onDone:function(r){var dn=$("dvDone");
      if(phase==="div"){missD=r.miss;dn.className="done show";dn.innerHTML="👍 <b>95 ÷ 38 ＝ 2 … 19</b>。接下來一定要<b>驗算</b>，而且要把答案整個寫完！<div class='btns'><button class='btn teal' id='dvGo'>✓ 開始驗算</button></div>";
        $("dvGo").onclick=function(){phase="check";$("dvHelper").className="helper";run.load(DivCore.checkSheet(N,d),"驗算：38 × 2 ＋ 19 ＝ 95 ？","95÷38（驗算）");};}
      else{missC=r.miss;dn.className="done";rec(true,{div:missD===0,check:missC===0},"95÷38＝2…19；驗算 38×2＋19＝95");
        finish("全部完成！<br>95 ÷ 38 ＝ <b>2 … 19</b><br>驗算：38 × 2 ＝ 76，76 ＋ 19 ＝ <b>95</b> ＝ 被除數 ✅"+(missD||missC?"<br><span class='small'>這次有寫錯過的格子："+(missD?"直式 "+missD+" 格 ":"")+(missC?"驗算 "+missC+" 格":"")+"</span>":""));}}});
  dvMistake=function(kind){if(phase==="div"&&!badD){badD=true;rec(false,{div:false},"直式："+kind);}else if(phase==="check"&&!badC){badC=true;rec(false,{div:missD===0,check:false},"驗算："+kind);}};
  pad("dvPad",function(dg,x){if(dg!==null)run.press(dg);else if(x==="hint"){if(run.field()){R1031.flag(cur.it.id,"hint");run.fb("info","💡 "+run.hintFor());}}else if(x==="help"){var hp=$("dvHelper");hp.classList.toggle("show");if(hp.classList.contains("show"))R1031.flag(cur.it.id,"hint");hp.innerHTML=helperHTML(run.field(),d);}},true);
  $("bShow").onclick=function(){shown("95 ÷ 38 ＝ 2 … 19；驗算 38 × 2 ＝ 76，76 ＋ 19 ＝ 95。");};
  run.load(DivCore.buildDiv(N,d),"95 ÷ 38 ＝ ？","95÷38");};

$("toList").onclick=showList;
$("resetAll").onclick=function(){if(!confirm("確定要清除 10/31 複習紀錄嗎？（國語錯字本、英文、數學頁原本的紀錄不會被清掉）"))return;try{localStorage.removeItem(R1031.K);}catch(e){}renderList();};
document.addEventListener("keydown",function(e){if(!cur||cur.it.id!=="m-div95")return;var t=e.target&&e.target.tagName;if(t==="INPUT")return;if(/^[0-9]$/.test(e.key)){var b=document.querySelector('#dvPad [data-d="'+e.key+'"]');if(b)b.click();}});
var m=/[?&]item=([a-z0-9\-]+)/.exec(location.search),it0=m&&byId(m[1]);
renderList();
if(it0)start(it0.id);
})();
